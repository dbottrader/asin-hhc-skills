name: skill-lint

# Frontmatter, name, and description gate for every skill.
# Adapted from elementalsouls/Claude-BugHunter .github/workflows/skill-lint.yml (MIT).
# Stdlib Python only.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills (frontmatter, names, descriptions)
        run: python3 scripts/lint_skills.py

      - name: Linter self-test
        run: python3 scripts/lint_skills.py --self-test
