name: doc-count-check

# Skill counts in the README and plugin manifests must match skills/ on disk.
# Adapted from elementalsouls/Claude-BugHunter .github/workflows/doc-count-check.yml (MIT).
# Stdlib Python only.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check doc counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify README and manifest counts match disk
        run: python3 scripts/check_doc_counts.py
